name: Language Server Runtime CI

on:
  push:
    branches:
      - `master`

  pull_request:
    branches:
      - `master`

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Sync Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run check:formatting

      - name: Compile
        run: npm run compile

      - name: Run Tests
        run: npm run test

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Sync Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run Tests
        run: npm run test
